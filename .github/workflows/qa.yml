name: qa

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    env:
      MONGO_URI: mongodb://localhost:27017/plmb_e2e
      SESSION_SECRET: ci-only-session-secret
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-only
      PLMB_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client

      - name: Lint
        run: npm run lint --prefix client

      - name: Unit tests
        run: |
          npm run test:unit -- --ci --coverage
          npm test --prefix client

      - name: Build
        run: npm run build --prefix client

      - name: Integration tests
        run: npm run test:integration -- --ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-reports
          path: |
            reports/
            playwright-report/
            client/dist/
          retention-days: 14

  report-failure:
    needs: qa
    if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `QA failed on ${context.sha.slice(0, 7)}`,
              body: `qa.yml failed.\n\nRun and test reports: ${runUrl}\nTriggered by @${context.actor}`,
              labels: ['qa-failed'],
            });
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [context.actor],
              });
            } catch (e) {
              core.warning(`Could not assign ${context.actor}: ${e.message}`);
            }
