name: dev

on:
  push:
    branches: [develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'ops/**', 'qa/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SESSION_SECRET: ci-only-session-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client

      - name: Lint
        run: npm run lint --prefix client

      - name: Build
        run: npm run build --prefix client

      - name: Unit tests
        run: |
          npm run test:unit -- --ci
          npm test --prefix client

      - name: Integration tests
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        run: npm run test:integration -- --ci

      - name: Deploy to Staging (Render)
        if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_STAGING_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render staging deployment..."
            curl -s -S -X POST "$RENDER_STAGING_DEPLOY_HOOK_URL"
          else
            echo "RENDER_STAGING_DEPLOY_HOOK_URL secret not set. Skipping automated deploy hook."
          fi
