<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquiry Page - Po Lao Marquez Benedictos & Co.</title>
  <link rel="stylesheet" href="/styles/inquiry_styles.css"> 
</head>
<body>
  <div class="header">
    <img id="logo" src="/image/logo.png">
    <h1> Po Lao Marquez Benedictos & Co. </h1>
    <p> Certified Public Accountants </p>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="about_us.html">About Us</a>
    <a href="newsletter-page.html">Newsletter</a>
    <a href="inquiry-page.html" class="active">Contact Us</a>
  </nav>

  <div class="inquiry-nav">
    <h3>Send Inquiry</h3>
  </div>

  <div class="inquiry-container">
  <form class="inquiry-form" id="inquiry-form">
    <div class="inquiry-name-row">
      <input type="text" class="inquiry-field" id="first-name-field" name="firstName" placeholder="First Name" required>
      <input type="text" class="inquiry-field" id="last-name-field" name="lastName" placeholder="Last Name" required>
    </div>
    
    <input type="text" class="inquiry-field" id="business-name-field" name="businessName" placeholder="Business Name" required>

    <select class="inquiry-field" id="category-field" name="category" required>
      <option value="" disabled selected>Select Inquiry Category</option>
      <option value="New Client General Inquiry">New Client General Inquiry</option>
      <option value="Audit & Assurance">Audit & Assurance</option>
      <option value="Tax Services">Tax Services</option>
      <option value="Accounting & Bookkeeping">Accounting & Bookkeeping</option>
      <option value="Business Advisory">Business Advisory</option>
      <option value="Payroll Services">Payroll Services</option>
      <option value="Billing Concerns">Billing Concerns</option>
      <option value="Comments & Complaints">Comments & Complaints</option>
      <option value="Other">Other</option>
    </select>

    <select class="inquiry-field" id="industry-sector-field" name="industrySector" required>
    <option value="" disabled selected>Select Industry Sector</option>
    <option value="Healthcare">Healthcare</option>
    <option value="Real Estate">Real Estate</option>
    <option value="Retail">Retail</option>
    <option value="Professional Services">Professional Services</option>
    <option value="Non-Profit">Non-Profit</option>
    <option value="Other">Other</option>
    </select>

    <input type="text" class="inquiry-field" id="subject-field" name="subject" placeholder="Subject" required>
    <textarea class="inquiry-field" id="message-field" name="message" placeholder="Send us a message..." required></textarea>

    <div class="inquiry-contact">
      <label for="inquiry-email">Email:</label>
      <input type="email" placeholder="name@email.com" id="inquiry-email" name="email" required>
    </div>

    <div id="form-status"></div>

    <input type="submit" class="inquiry-submit" value="Send Inquiry">
  </form>
</div>
  <div class="footer">
        <p><a href ="admin_login.html">© Po Lao Marquez Benedictos & Co.</a>   |   All Rights Reserved </p>
  </div>

  <div id="success-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h3>Inquiry sent!</h3>
    <p>Your ticket number is <strong id="modal-ticket"></strong>.</p>
    <p>Check your email for a confirmation.</p>
    <button id="modal-close">Close</button>
  </div>

  <script src="/public/js/inquiry.js"></script>
</div>
</body>
</html>
