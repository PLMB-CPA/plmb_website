<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inquiry Page - Po Lao Marquez Benedictos & Co.</title>
    <link rel="stylesheet" href="../styles/inquiry_styles.css"> 
  </head>

  <body>
    <div class="header">
      <img id="logo" src="../image/logo.png">
      <h1> Po Lao Marquez Benedictos & Co. </h1>
      <p> Certified Public Accountants </p>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about_us.html">About Us</a>
        <a href="newsletter-page.html">Newsletter</a>
        <a href="inquiry-page.html" class="active">Contact Us</a>
    </nav>

    <div class="inquiry-nav">
      <h3>Send Inquiry</h3>
    </div>

    <div class="inquiry-container">
      <form class="inquiry-form">
        <input type="text" class="inquiry-field" id="subject-field" placeholder="Subject">
        <textarea class="inquiry-field" id="message-field" placeholder="Send us a message..."></textarea>
        
        <div class="inquiry-contact">
          <label for="inquiry-email">Email: </label>
          <input type="text" placeholder="name@email.com" id="inquiry-email">
        </div>

        <input type="submit" class="inquiry-submit">
      </form>
    </div>

    <div class="footer">
      <p> © Po Lao Marquez Benedictos & Co.   |   All Rights Reserved </p>
    </div>

  </body>
</html>
