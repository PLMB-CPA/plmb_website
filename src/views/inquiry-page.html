<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Home Page - PLMB</title>
    <link rel="stylesheet" href="/styles.css"> 
  </head>

  <body>
    <h1 class="top"> Po Lao Marquez Benedictos & Co. </h1>
    <h2 class="top"> Certified Public Accountants </h2> <br>
    
    <header>
      <nav class="navbar">
        <h3> Home </h3>
        <h3> Services </h3>
        <h3> About Us </h3>
        <h3> Insights </h3>
        <h3> Contact Us </h3>
      </nav>
    </header>

    <hr>

    <section class="inquiry-nav">
      <h3>Send Inquiry</h3>
      <a href="#" class="inquiry-view"><p>View All →</p></a>
    </section>

    <section class="inquiry-form">
      <input type="text" class="inquiry-field" id="subject-field" placeholder="Subject">
      <textarea class="inquiry-field" id="message-field" placeholder="Send us a message..."></textarea>
      
      <div class="inquiry-contact">
        <label for="inquiry-email">Email: </label>
        <input type="text" placeholder="name@email.com" id="inquiry-email">
      </div>

      <input type="submit" class="inquiry-submit">
    </section>

  </body>
</html>
