<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Po Lao Marquez Benedictos & Co.</title>
    <link rel="stylesheet" href="/styles/post-newsletter.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="bg-container">
        <div class="dashboard">
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <img id="logo" src="/image/logo.png">
                    <h1>PLMB</h1>
                </div>
                <nav class="sidebar-nav">
                    <a href="admin_dashboard.html" class="dash-side">
                        <img class="menu-icon" src="/image/menu.png">
                        <span>Dashboard</span>
                    </a>

                    <a href="admin_newsletter.html" class="dash-side active">
                        <img class="menu-icon" src="/image/newsletter-icon.png">
                        <span>Newsletters</span>
                    </a>

                    <a href="admin_inquiry_management.html" class="dash-side">
                        <img class="menu-icon" src="/image/inquiries-icon.png">
                        <span>Inquiries</span>
                    </a>

                    <a href="admin_management.html" class="dash-side">
                        <img class="menu-icon" src="/image/user.png">
                        <span>Manage</span>
                    </a>
                </nav>
                <a href="/api/admin/logout" class="dash-side logout">
                    <img class="menu-icon" src="/image/logout.png">
                    <span>Logout</span>
                </a>
            </aside>

            <div class="main-content">

                <div class="head">
                    <div class="head-left">
                        <h1>Admin Dashboard</h1>
                    </div>

                    <div class="divider"></div>

                    <div class="head-right">
                        <img id="admin-pfp" src="/image/admin-pfp.png" alt="Admin">

                        <div class="admin-info">
                            <h3></h3>
                            <p>Admin Job Role</p>
                        </div>
                    </div>
                </div>

                <div class="newsletter-container">
                    <button type="button" id="news-back" class="news-back">&#8592; Back to newsletters</button>

                    <input type="text" id="news-subject" class="news-subject" placeholder="Subject">

                    <div class="news-toolbar" id="news-toolbar">
                        <select class="tb-select" id="tb-block" title="Paragraph style">
                            <option value="p">Normal text</option>
                            <option value="h2">Heading</option>
                            <option value="h3">Subheading</option>
                        </select>

                        <select class="tb-select" id="tb-size" title="Font size">
                            <option value="">Size</option>
                            <option value="2">Small</option>
                            <option value="3">Normal</option>
                            <option value="5">Large</option>
                            <option value="6">Extra large</option>
                        </select>

                        <span class="tb-divider"></span>

                        <button type="button" class="tb-btn tb-bold" data-command="bold" title="Bold">B</button>
                        <button type="button" class="tb-btn tb-italic" data-command="italic" title="Italic">I</button>
                        <button type="button" class="tb-btn tb-underline" data-command="underline" title="Underline">U</button>

                        <span class="tb-divider"></span>

                        <button type="button" class="tb-btn" data-command="insertUnorderedList" title="Bulleted list">&bull; List</button>
                        <button type="button" class="tb-btn" data-command="insertOrderedList" title="Numbered list">1. List</button>
                        <button type="button" class="tb-btn" id="tb-clear" title="Remove formatting from the selected text">Clear</button>

                        <span class="tb-divider"></span>

                        <button type="button" class="tb-btn" data-command="justifyLeft" title="Align left">&#8676;</button>
                        <button type="button" class="tb-btn" data-command="justifyCenter" title="Align center">&#8596;</button>
                        <button type="button" class="tb-btn" data-command="justifyRight" title="Align right">&#8677;</button>

                        <span class="tb-divider"></span>

                        <button type="button" class="tb-btn" id="tb-link" title="Insert link">Link</button>
                    </div>

                    <div id="news-content" class="news-content" contenteditable="true"
                         data-placeholder="Type your text here..."></div>

                    <input type="url" id="news-image" class="news-image" placeholder="Image URL (https://...)" hidden>
                    <button type="button" id="toggle-image" class="upload-img">Add image</button>

                    <p id="news-status" class="news-status"></p>

                    <input type="submit" id="news-submit" class="news-submit" value="Submit for Review">
                </div>

            </div>
        </div>
    </div>
    <script src="/public/js/admin_headname.js"></script>
    <script src="/public/js/post-newsletter.js"></script>
</body>

</html>
