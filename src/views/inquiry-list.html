<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Po Lao Marquez Benedictos & Co.</title>
  <link rel="stylesheet" href="/styles/inquiry-list.css">
</head>
<body>
  <div class="bg-container"> 
    <div class="header">
      <img id="logo" src="/image/logo.png">
      <h1> Dashboard </h1>

      <div class="searchbar">
        <img class="search-icon" src="/image/search-icon.png">
        <input id="search" type="text" placeholder="Search newsletters, inquiries..."> <!-- OPTIONAL -->
      </div>

      <a href="">
        <img id="notifications" src="/image/notifications.png"> <!-- OPTIONAL, red circle will appear if there is notif -->
      </a>
    </div>

    <div class="dashboard">
      <div class="sidebar">
        <h1>Board</h1>
    
        <a href="#" class="dash-side">
          <img class="menu-icon" src="/image/menu.png">
          <span>Dashboard</span>
        </a>
    
        <a href="#" class="dash-side">
          <img class="menu-icon" src="/image/newsletter-icon.png">
          <span>Newsletters</span>
        </a>
    
        <a href="#" class="dash-side active">
          <img class="menu-icon" src="/image/inquiries-icon.png">
          <span>Inquiries</span>
        </a>
        
        <a href="#" class="dash-side">
          <img class="menu-icon" src="/image/settings.png">
          <span>Settings</span>
        </a>
    
        <a href="/api/admin/logout" class="dash-side logout">
          <img class="menu-icon" src="/image/logout.png">
          <span>Logout</span>
        </a>
      </div>

      <div class="main-content">
        <h1>Inquiries</h1>
        <div class="inquiries-container">
            
            <div class="inquiry-container">
                <p class="category">Category</p>
                <p class="industry">Industry</p>

            </div>
            <div class="inquiry-container">
                <p class="category">New Client General Inquiry</p>
                <p class="industry">Professional Services</p>
                <p class="title">Title</p>
                <p class="content">content cut adasdas off...</p>
            </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
