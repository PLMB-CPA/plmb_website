<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Po Lao Marquez Benedictos & Co.</title>
  <link rel="stylesheet" href="/styles/inquiry-full.css">
</head>
<body>
  <div class="bg-container">
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img id="logo" src="/image/logo.png">
          <h1>PLMB</h1>
        </div>
        <nav class="sidebar-nav">
          <a href="admin_dashboard.html" class="dash-side">
            <img class="menu-icon" src="/image/menu.png">
            <span>Dashboard</span>
          </a>

          <a href="admin_newsletter.html" class="dash-side">
            <img class="menu-icon" src="/image/newsletter-icon.png">
            <span>Newsletters</span>
          </a>

          <a href="admin_inquiry_management.html" class="dash-side active">
            <img class="menu-icon" src="/image/inquiries-icon.png">
            <span>Inquiries</span>
          </a>

          <a href="admin_management.html" class="dash-side">
            <img class="menu-icon" src="/image/user.png">
            <span>Manage</span>
          </a>
        </nav>
        <a href="/api/admin/logout" class="dash-side logout">
          <img class="menu-icon" src="/image/logout.png">
          <span>Logout</span>
        </a>
      </aside>

      <div class="main-content">
        <div class="head">
          <div class="head-left">
            <h1>Admin Dashboard</h1>
          </div>
          
          <div class="divider"></div>

          <div class="head-right">
            <img id="admin-pfp" src="/image/admin-pfp.png" alt="Admin">

            <div class="admin-info">
              <h3></h3>
              <p>Admin Job Role</p>
            </div>
          </div>

        </div>
        <div class="inquiry-message">
          <div class="message-header">
              <h1 class="title">Title</h1>
              <div class="status-badges">
                  <span class="status-badge unread read-badge">Unread</span>
                  <span class="status-badge unanswered answered-badge">Unanswered</span>
                  <span class="status-badge archived archived-badge" style="display:none;">Archived</span>
              </div>
          </div>

          <div class="tags">
              <p class="category">Category</p>
              <p class="industry">Industry</p>
          </div>

          <p class="content">Loading...</p>

          <div class="contact-container">
              <p>Contact:</p>
              <p class="contact">smth@mail.com</p>
          </div>

          <div class="action-bar">
              <button type="button" class="action-btn read-btn">Mark as Read</button>
              <button type="button" class="action-btn answered-btn">Mark as Answered</button>
              <button type="button" class="action-btn archive-btn">Archive</button>
              <button type="button" class="delete-button">Delete Inquiry</button>
          </div>
      </div>
        
        </div>

      </div>
    </div>
  </div>
  <script src="/public/js/admin_headname.js"></script>
  <script src="/public/js/inquiry-full.js"></script>
</body>
</html>
