<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Po Lao Marquez Benedictos & Co.</title>
  <link rel="stylesheet" href="/styles/admin_dashboard_styles.css">
</head>
<body>
  <div class="bg-container"> 
    <div class="header">
      <img id="logo" src="/image/logo.png">
      <h1> Dashboard </h1>

      <div class="searchbar">
        <img class="search-icon" src="/image/search-icon.png">
        <input id="search" type="text" placeholder="Search newsletters, inquiries..."> <!-- OPTIONAL -->
      </div>

      <a href="">
        <img id="notifications" src="/image/notifications.png"> <!-- OPTIONAL, red circle will appear if there is notif -->
      </a>
    </div>

    <div class="dashboard">
      <div class="sidebar">
        <h1>Board</h1>
    
        <a href="#" class="dash-side active">
          <img class="menu-icon" src="/image/menu.png">
          <span>Dashboard</span>
        </a>
    
        <a href="#" class="dash-side">
          <img class="menu-icon" src="/image/newsletter-icon.png">
          <span>Newsletters</span>
        </a>
    
        <a href="#" class="dash-side">
          <img class="menu-icon" src="/image/inquiries-icon.png">
          <span>Inquiries</span>
        </a>
    
        <a href="#" class="dash-side">
          <img class="menu-icon" src="/image/settings.png">
          <span>Settings</span>
        </a>
    
        <a href="#" class="dash-side logout">
          <img class="menu-icon" src="/image/logout.png">
          <span>Logout</span>
        </a>
      </div>

      <div class="main-content">
        <div class="welcome-message">
          <h1>Welcome back, Admin</h1>
          <p>Here's what's happening today.</p>
        </div>

        <div class="cards">
          <div class="card">
            <h2>24</h2>
            <p>Pending Inquiries</p>
          </div>
      
          <div class="card">
            <h2>8</h2>
            <p>Newsletters</p>
          </div>
      
          <div class="card">
            <h2>156</h2>
            <p>Total Users</p>
          </div>
        </div>

        <div class="activity">
          <h2>Recent Activity</h2>
          <p> add here</p>
        </div>

        <div class="quick-actions">
          <a href="#" class="action-btn">
            <span>New Newsletter</span>
          </a>

          <a href="#" class="action-btn">
            <span>View Inquiries</span>
          </a>

          <a href="#" class="action-btn">
            <span>Manage Users</span>
          </a>

          <a href="#" class="action-btn">
            <span>Manage Admins</span>
          </a>

          <a href="#" class="action-btn">
            <span>Company Settings</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
