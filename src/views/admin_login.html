<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> PLMB Admin Log-In </title>
    <link rel="stylesheet" href="/styles/login_styles.css">
</head>

<body>
<div class = "main">

    <form class = "login_form" id = "login-form" method = "POST" action = "/api/admin/login">
        <div class = "login_block">
            <h2 class = "login_header"> User Sign-In </h2>
			<div class = "login_inputs">
				<div class = "username">
					<input type="text" placeholder="Username" id="username" name="username" required>
				</div>

                <div class = "password" id="pw-container">
                    <input type = "password" placeholder="Password" id = "password" name = "password" required>
                    <button class="show-password" id="pw-button" type="button"></button>
                </div>           
            </div>  

            <div class = "remember">
                <label> <input type = "checkbox" id = "remember" name = "remember"> Remember Me </label>
            </div>

            <p id = "login-error" class = "login-error"></p>

            <div class = "login_action">
                <button type = "submit" id = "login_btn"> Log-in </button>
                <a href = "index.html" class = "btn">Return to Main Page</a>
            </div>
        </div>

    </form>

</div>

<script src="/public/js/login.js"></script>
<script src="/public/js/password-toggle.js"></script>
</body>
</html>
