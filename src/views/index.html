<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        <title> Po Lao Marquez Benedictos Online Portal </title>
        <link rel="stylesheet" href="../styles/login_styles.css">
    </head>
    
    <body>        
        <div class = "index">
            <div class = "welcome">
                <h1> Welcome!</h1>
                <p> The Po Lao Marquez Benedictos Online Portal </p>
            </div>
            <div class = "get-info">
                <h1 class> Log-in </h1>

                <div class="info-form">
                    <form action="services.html" method="get">
                        <h3> Email </h3>
                        <input type="email" id="username" placeholder="user@gmail.com"/>
                        <h3> Password </h3>
                        <input type="password" id="password" placeholder="••••••••"/>
                        <button type="submit">Log In</button>
                    </form>

                    <a> Don't have an account yet? Sign-in <a> <br>
                    <a> Or continue as guest </a>
                </div>
            </div>
        </div>
    </body>
</html>
